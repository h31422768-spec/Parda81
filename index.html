<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ko’rpa tahlili</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b5532a">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#faf6f0;--card:#fff;--tx:#2b2118;--mu:#7a6a5a;--ac:#b5532a;--bd:#e6dccf;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1713;--card:#272019;--tx:#f3eadf;--mu:#b3a290;--ac:#e08a5b;--bd:#3a3128;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1713;--card:#272019;--tx:#f3eadf;--mu:#b3a290;--ac:#e08a5b;--bd:#3a3128;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:560px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 14px}
nav{display:flex;gap:8px;margin-bottom:14px}
nav a{flex:1;text-align:center;padding:10px;border:1px solid var(--bd);border-radius:10px;color:var(--mu);text-decoration:none;font-weight:600}
nav a.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:20px}
label{display:block;font-size:14px;color:var(--mu);margin:12px 0 4px}
input,select{width:100%;padding:11px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
button{margin-top:16px;width:100%;padding:12px;font-size:16px;font-weight:600;border:0;border-radius:10px;background:var(--ac);color:#fff}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:15px}
.row:last-child{border:0}.mu{color:var(--mu);font-size:13px}
.two{display:flex;gap:10px}.two>div{flex:1}
.page{display:none}.page.on{display:block}
</style>
</head>
<body>
<h1>🛏️ Ko’rpa tahlili</h1>
<nav><a href="#paxta" id="n1">1-bet: Paxta</a><a href="#zakas" id="n2">2-bet: Zakas</a></nav>

<section class="page" id="paxta">
<div class="card">
<h2>Paxta kilosi</h2>
<label for="kilo">Kilosi (kg)</label>
<input id="kilo" type="number" inputmode="decimal" placeholder="Masalan: 12.5">
<label for="sana">Sana</label>
<input id="sana" type="date">
<label for="pul">Pul:</label>
<input id="pul" type="number" inputmode="numeric" placeholder="Summa (so’m)">
<button id="sp">Saqlash</button>
</div>
<div class="card"><h2>Yozuvlar</h2><div id="lp"></div></div>
</section>

<section class="page" id="zakas">
<div class="card">
<h2>Zakas</h2>
<label for="ism">Ism familiya</label>
<input id="ism" placeholder="Ism va familiyasi">
<label for="tur">Ko’rpa yoki parda</label>
<select id="tur"><option>Ko’rpa</option><option>Parda</option></select>
<div class="two">
<div><label for="metr">Metr</label><input id="metr" type="number" inputmode="decimal"></div>
<div><label for="soni">Soni</label><input id="soni" type="number" inputmode="numeric"></div>
</div>
<button id="sz">Saqlash</button>
</div>
<div class="card"><h2>Zakaslar</h2><div id="lz"></div></div>
</section>

<script>
var D={p:[],z:[]};
try{var s=localStorage.getItem("korpa");if(s)D=JSON.parse(s)}catch(e){}
function save(){try{localStorage.setItem("korpa",JSON.stringify(D))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(t){return String(t).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function fmt(n){return Number(n).toLocaleString("ru-RU")}
$("sana").valueAsDate=new Date();
function draw(){
 var kg=0,sum=0;
 $("lp").innerHTML=D.p.length?D.p.map(function(r){kg+=+r.k;sum+=+r.m;return '<div class="row"><span>'+esc(r.d)+'<br><span class="mu">'+esc(r.k)+' kg</span></span><b>'+fmt(r.m)+' so’m</b></div>'}).join("")+'<div class="row"><b>Jami: '+kg+' kg</b><b>'+fmt(sum)+' so’m</b></div>':'<span class="mu">Hozircha yozuv yo’q</span>';
 $("lz").innerHTML=D.z.length?D.z.map(function(r){return '<div class="row"><span><b>'+esc(r.n)+'</b><br><span class="mu">'+esc(r.t)+'</span></span><span>'+esc(r.m)+' metr × '+esc(r.s)+' ta</span></div>'}).join(""):'<span class="mu">Hozircha zakas yo’q</span>';
}
$("sp").onclick=function(){
 if(!$("kilo").value||!$("pul").value)return;
 D.p.push({k:$("kilo").value,d:$("sana").value,m:$("pul").value});
 $("kilo").value="";$("pul").value="";save();draw();
};
$("sz").onclick=function(){
 if(!$("ism").value.trim())return;
 D.z.push({n:$("ism").value.trim(),t:$("tur").value,m:$("metr").value||0,s:$("soni").value||0});
 $("ism").value="";$("metr").value="";$("soni").value="";save();draw();
};
function route(){
 var h=location.hash==="#zakas"?"zakas":"paxta";
 $("paxta").className="page"+(h==="paxta"?" on":"");
 $("zakas").className="page"+(h==="zakas"?" on":"");
 $("n1").className=h==="paxta"?"on":"";$("n2").className=h==="zakas"?"on":"";
}
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
window.addEventListener("hashchange",route);route();draw();
</script>
</body>
</html>
